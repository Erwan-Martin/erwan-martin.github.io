#                Projects Page Data
###########################################################
page_data:
  main:
    header: "Projects"
    info: "Your Project page description."
    text_color: "white"
    # if you don't want to use background image, comment it. back_color will be activated.
    img: ":projects-heading.jpg"
    back_color: "lightblue"

  category:
    - title: "Example"
      type: id_example
      color: "gray"
    - title: "Picture"
      type: id_picture
      color: "#62b462"
    - title: "Quote"
      type: id_quote
      color: "#2FD0ED"

  list:
    # example
    - type: id_example
      project_name: "Large-scale clustered attractor network model evokes persistent activity in vitro through novel network clamp method"
      project_excerpt: "PhD thesis in Neuroscience from the University of Western Ontario"
      img: ":project1_thumb.jpg"
      img_title: "img title1"
      date: "2026-06-10"
      post: |
        # Examples

        I presented my PhD thesis on April 27th 2026. It is now available at [Erwan Martin thesis](https://uwo.scholaris.ca/items/3c02f31f-9083-4935-b8cb-9a22dd8e0ef8)

        <iframe src="/assets/files/Erwan_Martin_PhD_2025_thesis.pdf" width="100%" height="800px" style="margin-top:1rem; border: none;"></iframe>

    # picture
    - type: id_picture
      project_name: "Example Project"
      project_excerpt: "Picture"
      img: ":project2_thumb.jpg"
      img_title: "img title2"
      date: "2021-04-23"
      post: |
        # Title
        This is project content.

        ![Image](:project2_thumb.jpg)

    # quote
    - type: id_quote
      project_name: "Example Project"
      project_excerpt: "William Shakespeare"
      #img: ":project1_thumb.jpg"
      #img_title: "img title3"
      date: "2021-05-27"
      post: |
        Let me not to the marriage of true minds
        Admit impediments. Love is not love
        Which alters when it alteration finds,
        Or bends with the remover to remove.
        O no, it is an ever-fixed mark
        That looks on tempests and is never shaken;
        It is the star to every wand'ring barque,
        Whose worth's unknown, although his height be taken.
        Love's not Time's fool, though rosy lips and cheeks
        Within his bending sickle's compass come;
        Love alters not with his brief hours and weeks,
        But bears it out even to the edge of doom.
        If this be error and upon me proved,
        I never writ, nor no man ever loved.
    - type: id_quote
      project_name: "Example Project"
      project_excerpt: "Albert Einstein"
      img: ":project2_thumb.jpg"
      img_title: "img title4"
      date: "2021-06-08"
      post: |
        Two things are infinite: the universe and human stupidity; and I'm not sure about the universe.
    - type: id_quote
      project_name: "Example Project"
      project_excerpt: "Mae West"
      img: ":project1_thumb.jpg"
      img_title: "img title5"
      date: "2021-08-20"
      post: |
        You only live once, but if you do it right, once is enough.
    - type: id_quote
      project_name: "Example Project"
      project_excerpt: "Mahatma Gandhi "
      img: ":project2_thumb.jpg"
      img_title: "img title6"
      date: "2021-12-20"
      post: |
        Be the change that you wish to see in the world.
