---
layout: default
---
<article class="wrap page prose-page">
  <header class="page-head">
    <p class="kicker"><a href="{{ '/publications/' | relative_url }}">Publications</a> · {{ page.kicker }}</p>
    <h1>{{ page.title }}</h1>
    <p class="muted">Erwan Martin{% if page.pdf %} · <a href="{{ page.pdf | relative_url }}" download>Download PDF</a>{% endif %}</p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
